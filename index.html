<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>Custom Frequency Synth - Presets & Drag & Drop</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* BARRA LATERALE PRESET */
    .sidebar {
      width: 220px;
      background: #181818;
      border-right: 1px solid #2a2a2a;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar h2 {
      font-size: 1.1em;
      margin-top: 0;
      margin-bottom: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .preset-btn {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #222;
      color: #ccc;
      cursor: pointer;
      text-align: left;
      font-weight: bold;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: #2a2a2a;
      color: #fff;
    }

    .preset-btn.active {
      background: #00adb5;
      color: #fff;
      border-color: #00adb5;
    }

    /* CONTENUTO PRINCIPALE */
    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      text-align: center;
    }

    /* Form e Controlli */
    .editor-panel {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      max-width: 700px;
      margin: 0 auto 30px auto;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .editor-panel input {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      width: 110px;
    }

    .editor-panel button,
    .btn-delete {
      padding: 8px 15px;
      border-radius: 4px;
      border: none;
      background: #00adb5;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    .editor-panel button:hover {
      background: #008c93;
    }

    .btn-reset {
      background: #555 !important;
    }

    .btn-reset:hover {
      background: #666 !important;
    }

    /* Contenitore Sintetizzatore */
    .synth-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .key-card {
      border: 2px solid #333;
      background: #222;
      border-radius: 8px;
      padding: 15px;
      width: 120px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      transition: all 0.1s;
      cursor: grab;
    }

    .key-card:active {
      cursor: grabbing;
    }

    .key-card.dragging {
      opacity: 0.4;
      border-color: #00adb5;
    }

    .key-card.drag-over {
      border-color: #fff;
      transform: scale(1.05);
    }

    .key-card.active {
      background: #00adb5;
      border-color: #fff;
      transform: translateY(4px);
    }

    .key-card.active input {
      background: transparent;
      color: #fff;
      border-color: rgba(255, 255, 255, 0.5);
    }

    /* Input dentro la scheda */
    .key-card input {
      background: #1a1a1a;
      border: 1px solid #444;
      color: #eee;
      border-radius: 4px;
      padding: 4px;
      text-align: center;
      font-size: 0.9em;
    }

    .key-card input.key-shortcut {
      font-weight: bold;
      font-size: 1.1em;
      color: #00adb5;
      text-transform: uppercase;
    }

    .key-card.active input.key-shortcut {
      color: #fff;
    }

    .btn-delete {
      background: #ff4d4d;
      padding: 2px 6px;
      font-size: 0.8em;
      position: absolute;
      top: 5px;
      right: 5px;
    }

    .btn-delete:hover {
      background: #cc0000;
    }
  </style>
</head>

<body>

  <!-- BARRA LATERALE PER I PRESET -->
  <div class="sidebar">
    <h2>Preset</h2>
    <div id="preset-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
  </div>

  <!-- AREA PRINCIPALE DEL SYNTH -->
  <div class="main-content">
    <h1 id="current-preset-title">Sintetizzatore Interattivo</h1>

    <!-- Form di Inserimento & Reset -->
    <div class="editor-panel">
      <input type="text" id="newKey" placeholder="Tasto (es. z)" maxlength="1">
      <input type="text" id="newName" placeholder="Nome">
      <input type="number" id="newFreq" placeholder="Freq (Hz)" step="0.1">
      <button onclick="addKey()">+ Aggiungi</button>
      <button class="btn-reset" onclick="resetDefaults()">Ripristina Custom</button>
    </div>

    <!-- Area Tastiera Synth -->
    <div class="synth-container" id="synth"></div>
  </div>

  <script>
    // 1. DEFINIZIONE DEI PRESET HARDCODATI
    const defaultCustomMap = [
      { key: 'a', name: 'Basso', freq: 110.0 },
      { key: 's', name: 'Calmo', freq: 220.0 },
      { key: 'd', name: 'Armonia', freq: 432.0 },
      { key: 'f', name: 'Standard', freq: 440.0 },
      { key: 'g', name: 'Luce', freq: 528.0 },
      { key: 'h', name: 'Acuto', freq: 880.0 }
    ];

    const presetList = [
      {
        id: 'custom',
        label: 'Custom (Tuo)',
        // Carica da localStorage se presente, altrimenti default
        data: JSON.parse(localStorage.getItem('myCustomSynth')) || defaultCustomMap
      },
      {
        id: 'jt',
        label: 'Just Tuning',
        data: [
          { key: '1', name: '1/1 - 1', freq: 440.0 },
          { key: '2', name: '9/8 - 2', freq: 495.0 },
          { key: '3', name: '5/4 - 3', freq: 550.0 },
          { key: '4', name: '4/3 - 4', freq: 586.7 },
          { key: '5', name: '3/2 - 5', freq: 660.0 },
          { key: '6', name: '5/3 - 6', freq: 733.3 },
          { key: '7', name: '15/8 - 7', freq: 825.0 },
          { key: '8', name: '2/1 - 8', freq: 880.0 }
        ]
      },
      {
        id: 'pt',
        label: 'Pythagorean Tuning',
        data: [
          { key: '1', name: '1/1 - 1', freq: 440.0 },
          { key: '2', name: '9/8 - 2', freq: 495.0 },
          { key: '3', name: '81/64 - 3', freq: 556.9 },
          { key: '4', name: '4/3 - 4', freq: 586.7 },
          { key: '5', name: '3/2 - 5', freq: 660.0 },
          { key: '6', name: '27/16 - 6', freq: 742.5 },
          { key: '7', name: '243/128 - 7', freq: 835.3 },
          { key: '8', name: '2/1 - 8', freq: 880.0 }
        ]
      },
      {
        id: 'mtt',
        label: 'Mean Tone Tuning',
        data: [
          { key: '1', name: '1/1 - 1', freq: 440.0 },
          { key: '2', name: '5^(1/2)/2 - 2', freq: 491.95 },
          { key: '3', name: '5/4 - 3', freq: 550.0 },
          { key: '4', name: '2/5^(1/4) - 4', freq: 588.57 },
          { key: '5', name: '5^(1/4) - 5', freq: 657.96 },
          { key: '6', name: '5^(3/4)/2 - 6', freq: 735.61 },
          { key: '7', name: '5^(5/4)/2 - 7', freq: 822.42 },
          { key: '8', name: '2/1 - 8', freq: 880.0 }
        ]
      }
    ];

    // Stato corrente
    let activePresetId = 'custom';
    let soundMap = [...presetList.find(p => p.id === activePresetId).data];

    // 2. AUDIO CONTEXT
    let audioCtx = null;
    const activeOscillators = {};

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function saveCustomState() {
      // Salva le modifiche solo se siamo sul preset Custom
      const customPreset = presetList.find(p => p.id === 'custom');
      customPreset.data = [...soundMap];
      localStorage.setItem('myCustomSynth', JSON.stringify(soundMap));
    }

    // Passa automaticamente al preset "Custom" se si apportano modifiche a un preset fisso
    function ensureCustomPreset() {
      if (activePresetId !== 'custom') {
        activePresetId = 'custom';
        renderSidebar();
      }
    }

    // 3. RENDERING SIDEBAR & SYNTH
    function renderSidebar() {
      const container = document.getElementById('preset-list');
      container.innerHTML = '';

      presetList.forEach(p => {
        const btn = document.createElement('button');
        btn.className = `preset-btn ${p.id === activePresetId ? 'active' : ''}`;
        btn.innerText = p.label;
        btn.onclick = () => selectPreset(p.id);
        container.appendChild(btn);
      });

      document.getElementById('current-preset-title').innerText =
        `Preset: ${presetList.find(p => p.id === activePresetId).label}`;
    }

    function selectPreset(presetId) {
      activePresetId = presetId;
      const target = presetList.find(p => p.id === presetId);
      // Clona l'array per evitare modifiche dirette ai preset di base
      soundMap = JSON.parse(JSON.stringify(target.data));
      renderSidebar();
      renderSynth();
    }

    let draggedIndex = null;

    function renderSynth() {
      const container = document.getElementById('synth');
      container.innerHTML = '';

      soundMap.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'key-card';
        card.id = `key-${item.key.toLowerCase()}`;
        card.setAttribute('draggable', 'true');
        card.dataset.index = index;

        card.innerHTML = `
          <button class="btn-delete" onclick="removeKey(${index})">✕</button>
          <label style="font-size:0.7em; color:#888; pointer-events:none;">TASTO</label>
          <input type="text" class="key-shortcut" value="${item.key}" maxlength="1" onchange="updateItem(${index}, 'key', this.value)">
          
          <label style="font-size:0.7em; color:#888; pointer-events:none;">NOME</label>
          <input type="text" value="${item.name}" onchange="updateItem(${index}, 'name', this.value)">
          
          <label style="font-size:0.7em; color:#888; pointer-events:none;">FREQ (Hz)</label>
          <input type="number" value="${item.freq}" step="0.1" onchange="updateItem(${index}, 'freq', this.value)">
        `;

        // Eventi Drag & Drop
        card.addEventListener('dragstart', (e) => {
          draggedIndex = index;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.key-card').forEach(c => c.classList.remove('drag-over'));
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          card.classList.add('drag-over');
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');

          if (draggedIndex !== null && draggedIndex !== index) {
            ensureCustomPreset();
            const movedItem = soundMap.splice(draggedIndex, 1)[0];
            soundMap.splice(index, 0, movedItem);

            saveCustomState();
            renderSynth();
          }
        });

        container.appendChild(card);
      });
    }

    // 4. GESTIONE STATO
    function addKey() {
      const keyInput = document.getElementById('newKey');
      const nameInput = document.getElementById('newName');
      const freqInput = document.getElementById('newFreq');

      if (!keyInput.value || !freqInput.value) {
        alert("Inserisci almeno il tasto e la frequenza!");
        return;
      }

      ensureCustomPreset();

      soundMap.push({
        key: keyInput.value.toLowerCase(),
        name: nameInput.value || 'Nota',
        freq: parseFloat(freqInput.value)
      });

      saveCustomState();
      renderSynth();

      keyInput.value = '';
      nameInput.value = '';
      freqInput.value = '';
    }

    function updateItem(index, property, value) {
      ensureCustomPreset();

      if (property === 'freq') value = parseFloat(value) || 0;
      if (property === 'key') value = value.toLowerCase();

      soundMap[index][property] = value;
      saveCustomState();
      renderSynth();
    }

    function removeKey(index) {
      ensureCustomPreset();
      soundMap.splice(index, 1);
      saveCustomState();
      renderSynth();
    }

    function resetDefaults() {
      if (confirm("Vuoi davvero ripristinare il preset Custom ai suoi valori di default?")) {
        // 1. Ripristina l'array locale ai dati di default
        soundMap = JSON.parse(JSON.stringify(defaultCustomMap));

        // 2. Aggiorna i dati del preset 'custom' dentro la lista dei preset
        const customPreset = presetList.find(p => p.id === 'custom');
        if (customPreset) {
          customPreset.data = [...soundMap];
        }

        // 3. Sovrascrivi il localStorage con i dati puliti
        localStorage.setItem('myCustomSynth', JSON.stringify(soundMap));

        // 4. Forza lo stato su 'custom' e riaggiorna l'interfaccia
        activePresetId = 'custom';
        renderSidebar();
        renderSynth();
      }
    }

    // 5. MOTORE AUDIO
    function playFrequency(key, freq) {
      initAudio();
      if (activeOscillators[key]) return;

      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      osc.start();
      activeOscillators[key] = { osc, gainNode };

      const keyEl = document.getElementById(`key-${key}`);
      if (keyEl) keyEl.classList.add('active');
    }

    function stopFrequency(key) {
      if (!activeOscillators[key]) return;

      const { osc, gainNode } = activeOscillators[key];
      gainNode.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

      setTimeout(() => {
        osc.stop();
        osc.disconnect();
        delete activeOscillators[key];
      }, 100);

      const keyEl = document.getElementById(`key-${key}`);
      if (keyEl) keyEl.classList.remove('active');
    }

    // 6. EVENT LISTENERS
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      const key = e.key.toLowerCase();
      const match = soundMap.find(item => item.key.toLowerCase() === key);
      if (match) playFrequency(match.key.toLowerCase(), match.freq);
    });

    window.addEventListener('keyup', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      const key = e.key.toLowerCase();
      const match = soundMap.find(item => item.key.toLowerCase() === key);
      if (match) stopFrequency(match.key.toLowerCase());
    });

    // Avvio
    renderSidebar();
    renderSynth();
  </script>
</body>

</html>
