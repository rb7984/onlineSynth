<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>Custom Frequency Synth - Sequencer & Presets</title>
  <link href="./style.css" rel = "stylesheet"> </link>
</head>

<body>

  <!-- BARRA LATERALE PER I PRESET -->
  <div class="sidebar">
    <h2>Preset</h2>
    <div id="preset-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
  </div>

  <!-- AREA PRINCIPALE DEL SYNTH -->
  <div class="main-content">
    <h1 id="current-preset-title">Sintetizzatore Interattivo</h1>

    <!-- Form di Inserimento & Reset -->
    <div class="editor-panel">
      <input type="text" id="newKey" placeholder="Tasto (es. z)" maxlength="1">
      <input type="text" id="newName" placeholder="Nome">
      <input type="number" id="newFreq" placeholder="Freq (Hz)" step="0.1">
      <button onclick="addKey()">+ Aggiungi</button>
      <button class="btn-reset" onclick="resetDefaults()">Ripristina Custom</button>
    </div>

    <!-- Pannello Sequencer Random -->
    <div class="sequencer-panel">
      <button id="btnPlaySeq" class="btn-play" onclick="toggleRandomSequence()">▶ Random Sequence</button>
      <div class="seq-input-group">
        <label for="seqLength">Note:</label>
        <input type="number" id="seqLength" value="16" min="1" max="64">
      </div>
      <div class="seq-input-group">
        <label for="seqSpeed">BPM (Velocità):</label>
        <input type="number" id="seqSpeed" value="240" min="40" max="600" step="10">
      </div>
      <div class="seq-input-group">
        <label for="seq">sequence:</label>
        <input type="text" id="seq" value="">
      </div>
    </div>

    <!-- Area Tastiera Synth -->
    <div class="synth-container" id="synth"></div>
  </div>

  <script src="./src/script.js"></script>
</body>

</html>
